<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Aggregates grouped into bounded contexts and connected by policies</title>
  <desc id="desc">Three dashed boxes are bounded contexts. Ordering holds the Order aggregate with Place order and Cancel order. Users holds the User aggregate with Validate user, which ends in User validated or User rejected. Audit holds the AuditLog aggregate with Create audit log. The policy New order reacts to Order placed and issues Validate user and Create audit log. The policy Rejected user reacts to User rejected and issues Cancel order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="1000" height="510" fill="#ffffff"/>

  <g fill="none" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="8 6">
    <rect x="20" y="40" width="380" height="210" rx="14"/>
    <rect x="600" y="40" width="380" height="210" rx="14"/>
    <rect x="430" y="330" width="380" height="120" rx="14"/>
  </g>
  <g font-size="15" font-style="italic" fill="#6b6b6b">
    <text x="36" y="30">Ordering</text>
    <text x="616" y="30">Users</text>
    <text x="446" y="320">Audit</text>
  </g>

  <g stroke-width="1.5">
    <g fill="#6fd6f7" stroke="#3aa9cf">
      <rect x="40" y="70" width="110" height="70" rx="3"/>
      <rect x="40" y="160" width="110" height="70" rx="3"/>
      <rect x="620" y="70" width="110" height="70" rx="3"/>
      <rect x="450" y="355" width="110" height="70" rx="3"/>
    </g>
    <g fill="#f5cf2d" stroke="#c9a514">
      <rect x="160" y="70" width="80" height="160" rx="3"/>
      <rect x="740" y="70" width="80" height="160" rx="3"/>
      <rect x="570" y="355" width="100" height="70" rx="3"/>
    </g>
    <g fill="#ffa04b" stroke="#d97f2b">
      <rect x="250" y="70" width="130" height="70" rx="3"/>
      <rect x="250" y="160" width="130" height="70" rx="3"/>
      <rect x="830" y="70" width="130" height="70" rx="3"/>
      <rect x="830" y="160" width="130" height="70" rx="3"/>
      <rect x="680" y="355" width="110" height="70" rx="3"/>
    </g>
    <g fill="#e99bc4" stroke="#c46f9e">
      <rect x="450" y="70" width="110" height="70" rx="3"/>
      <rect x="840" y="355" width="120" height="70" rx="3"/>
    </g>
  </g>

  <g font-size="15" fill="#1f2328" text-anchor="middle">
    <text x="95" y="110">Place order</text>
    <text x="95" y="200">Cancel order</text>
    <text x="200" y="155" font-size="17">Order</text>
    <text x="315" y="110">Order placed</text>
    <text x="315" y="200">Order cancelled</text>

    <text x="505" y="110">New order</text>

    <text x="675" y="110">Validate user</text>
    <text x="780" y="155" font-size="17">User</text>
    <text x="895" y="110">User validated</text>
    <text x="895" y="200">User rejected</text>

    <text x="505" y="385">Create</text>
    <text x="505" y="404">audit log</text>
    <text x="620" y="395" font-size="17">AuditLog</text>
    <text x="735" y="385">Audit log</text>
    <text x="735" y="404">created</text>

    <text x="900" y="395">Rejected user</text>
  </g>

  <g fill="none" stroke="#1f2328" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M380,105 H448"/>
    <path d="M560,105 H618"/>
    <path d="M505,140 V353"/>
    <path d="M900,230 V353"/>
    <path d="M900,425 V480 H95 V232"/>
  </g>
</svg>
