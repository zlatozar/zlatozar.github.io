<header class="site-header" role="banner">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} home">
      <span class="brand__text">
        <span class="brand__name">Zlatozar</span>
        <span class="brand__tag">От дума на дума</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a
        class="site-nav__link{% if page.url == '/' %} is-active{% endif %}"
        href="{{ '/' | relative_url }}"
      >Writing</a>
      <a
        class="site-nav__link{% if page.url == '/archive/' %} is-active{% endif %}"
        href="{{ '/archive/' | relative_url }}"
      >Archive</a>
      <a
        class="site-nav__link{% if page.url == '/about/' %} is-active{% endif %}"
        href="{{ '/about/' | relative_url }}"
      >About</a>

      <span class="site-nav__sep" aria-hidden="true"></span>

      <a
        class="icon-btn"
        href="https://github.com/{{ site.author.github }}"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="GitHub profile"
        title="GitHub"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.17 1.18a10.98 10.98 0 0 1 5.76 0c2.2-1.49 3.16-1.18 3.16-1.18.63 1.58.24 2.75.12 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.39-5.25 5.67.41.36.78 1.06.78 2.14 0 1.55-.01 2.8-.01 3.18 0 .31.21.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
        </svg>
      </a>

      <a
        class="icon-btn"
        href="{{ '/feed.xml' | relative_url }}"
        aria-label="RSS / Atom Feed"
        title="RSS Feed"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11a9 9 0 0 1 9 9" />
          <path d="M4 4a16 16 0 0 1 16 16" />
          <circle cx="5" cy="19" r="1" fill="currentColor" />
        </svg>
      </a>

      <button
        type="button"
        class="icon-btn theme-toggle"
        id="theme-toggle"
        aria-label="Toggle color theme"
        title="Toggle dark/light theme"
      >
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
        </svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </button>
    </nav>
  </div>
</header>
