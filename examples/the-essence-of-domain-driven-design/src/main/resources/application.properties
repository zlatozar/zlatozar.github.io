spring.application.name=instrument-repair
spring.threads.virtual.enabled=true

# Spring Data JDBC quotes the names from @Table and @MappedCollection, H2 upper-cases the
# unquoted names in schema.sql. Case-insensitive identifiers make both match.
# A new name for each application context: tests start several, and each creates the schema.
spring.datasource.url=jdbc:h2:mem:repair-${random.uuid};CASE_INSENSITIVE_IDENTIFIERS=TRUE

# One size limit, two guards: RequestSizeLimit checks Content-Length (413), Jackson stops a
# chunked body while it reads it (400).
repair.max-request-bytes=16384
spring.jackson.factory.constraints.read.max-document-length=${repair.max-request-bytes}

# Modulith stores each event for a module listener until the listener succeeds. A failed event
# stays in the table, marked as failed, so it is not lost. This example does not resend it.
spring.modulith.events.jdbc.schema-initialization.enabled=true

# API reference at /scalar: one page for the three contracts. The build copies api/*.yaml to
# static/openapi, so the page shows the same files the code is generated from.
scalar.page-title=Instrument Repair API
scalar.sources[0].title=Department
scalar.sources[0].url=/openapi/department.yaml
scalar.sources[1].title=Workshop
scalar.sources[1].url=/openapi/workshop.yaml
scalar.sources[2].title=Accounting
scalar.sources[2].url=/openapi/accounting.yaml
scalar.telemetry=false
