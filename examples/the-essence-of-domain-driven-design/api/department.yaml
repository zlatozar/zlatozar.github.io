openapi: 3.0.3
info:
  title: Department API
  version: 1.0.0
  description: >
    A hospital department sends damaged instruments for repair and gets them back.
    The contract checks words and grammar (lexical and syntax checks). The domain has
    the last word on meaning: a value the contract accepts can still be refused with 422.
  license:
    name: MIT
    url: https://opensource.org/license/mit

tags:
  - name: Department

paths:
  /departments/{code}:
    get:
      tags: [Department]
      operationId: viewDepartment
      summary: Show the instruments and the open repair boxes of a department
      parameters:
        - $ref: '#/components/parameters/DepartmentCode'
      responses:
        '200':
          description: The department
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{code}/instruments/{instrumentId}/repair:
    post:
      tags: [Department]
      operationId: sendForRepair
      summary: Put a damaged instrument in a repair box
      description: >
        Sharpening and mechanical repairs go to different boxes. A third-party instrument is
        not repaired: the department asks its owner for a replacement.
      parameters:
        - $ref: '#/components/parameters/DepartmentCode'
        - $ref: '#/components/parameters/InstrumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Damage'
      responses:
        '202':
          description: The instrument waits for repair or for a replacement
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableContent'

  /departments/{code}/repair-boxes/{boxId}/approval:
    post:
      tags: [Department]
      operationId: approveRepairBox
      summary: Approve a repair box, so the workshop can take it
      description: Approving an approved box again changes nothing.
      parameters:
        - $ref: '#/components/parameters/DepartmentCode'
        - $ref: '#/components/parameters/RepairBoxId'
      responses:
        '202':
          description: The box is on its way to the workshop
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /departments/{code}/instruments/{instrumentId}/return:
    post:
      tags: [Department]
      operationId: returnFromRepair
      summary: Take a repaired instrument back into use
      parameters:
        - $ref: '#/components/parameters/DepartmentCode'
        - $ref: '#/components/parameters/InstrumentId'
      responses:
        '204':
          description: The instrument is usable again
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  parameters:
    DepartmentCode:
      name: code
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/DepartmentCode'
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InstrumentId'
    RepairBoxId:
      name: boxId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RepairBoxId'

  # Patterns are anchored: JSON Schema finds a pattern anywhere in the text,
  # Bean Validation matches the whole text. Anchors make both mean the same.
  schemas:
    DepartmentCode:
      type: string
      pattern: '^[A-Z][A-Z_]{1,19}$'
      example: SURGERY
    InstrumentId:
      type: string
      description: The code engraved on the instrument
      pattern: '^[A-Z]{2,4}-[0-9]{1,8}$'
      example: SC-1042
    RepairBoxId:
      type: integer
      format: int32
      minimum: 1
      example: 1

    Department:
      type: object
      required: [code, instruments, openBoxes]
      properties:
        code:
          $ref: '#/components/schemas/DepartmentCode'
        instruments:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'
        openBoxes:
          type: array
          items:
            $ref: '#/components/schemas/RepairBox'

    # No owner here: a field in the contract is a promise, and no client needs it yet.
    Instrument:
      type: object
      required: [id, name, state]
      properties:
        id:
          $ref: '#/components/schemas/InstrumentId'
        name:
          type: string
          example: Scalpel
        state:
          $ref: '#/components/schemas/InstrumentState'
    InstrumentState:
      type: string
      enum: [USABLE, WAITING_FOR_REPAIR, AT_WORKSHOP, WAITING_FOR_REPLACEMENT]

    RepairBox:
      type: object
      required: [id, category, items]
      properties:
        id:
          $ref: '#/components/schemas/RepairBoxId'
        category:
          $ref: '#/components/schemas/RepairCategory'
        items:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/RepairBoxItem'
    RepairCategory:
      type: string
      enum: [SHARPENING, MECHANICAL]
    RepairBoxItem:
      type: object
      required: [instrument, damage]
      properties:
        instrument:
          $ref: '#/components/schemas/InstrumentId'
        damage:
          $ref: '#/components/schemas/Damage'

    Damage:
      type: object
      required: [kind, note]
      properties:
        kind:
          $ref: '#/components/schemas/DamageKind'
        note:
          type: string
          description: What the nurse saw. A note of only spaces is refused with 422.
          minLength: 1
          maxLength: 200
          example: The tip is dull
    DamageKind:
      type: string
      enum: [BLUNT, BENT, BROKEN]

    # RFC 9457 problem details. Each context has its own copy: it is small, and
    # a shared file would couple the contracts.
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          description: Absent means about:blank
          type: string
          format: uri-reference
        title:
          type: string
          example: Bad Request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          description: One entry per invalid field
          type: array
          items:
            type: string
          example: ['note: size must be between 1 and 200']

  # Errors are also listed as plain JSON. Spring matches the Accept header against these types
  # even when the answer has no body, so a client that accepts only application/json would get
  # 406 on a successful POST. The body is still sent as application/problem+json.
  responses:
    BadRequest:
      description: The request breaks the contract
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such department, instrument or repair box
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The instrument is not in a state that allows this
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    ContentTooLarge:
      description: The request body is too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The request follows the contract but the domain refuses its values
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
