[project]
name = "printers-devil"
version = "0.1.0"
description = "Simplified PrintersDevil text formatter designed with Warnier/Orr thinking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
printers-devil = "printers_devil.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printers_devil"]

# ── Ruff ─────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.110",
]
